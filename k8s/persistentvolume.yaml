# PVC for SQLite database — 1 GB, single writer (matches replicas: 1)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ajj-sqlite-pvc
  namespace: ajj-jujitsu
  labels:
    app: ajj-app
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# PVC for uploaded images and thumbnails — 5 GB
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ajj-uploads-pvc
  namespace: ajj-jujitsu
  labels:
    app: ajj-app
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

